[build-system]
requires = ["ChimeraX-BundleBuilder>=1.4.0", "ChimeraX-Core~=1.6"]
build-backend = "chimerax.bundle_builder.cx_pep517"

[project]
name = "ChimeraX-AlphaLens"
version = "1.6.1"
license = { text = "MIT" }
authors = [{ name = "Dima Molodenskiy" }, { name = "Kosinski Group, EMBL Hamburg" }]
description = "Interactive PAE, contact-probability, model-contact, spread and agreement plots for AlphaFold2 and AlphaFold3 predictions, with local prediction"
dependencies = ["ChimeraX-Core~=1.10", "ChimeraX-AlphaFold~=1.0"]
dynamic = ["classifiers", "requires-python"]

[project.readme]
content-type = "text/markdown"
text = """AlphaLens shows an AlphaFold2 or AlphaFold3 prediction as an interactive plot beside the
structure. Besides the PAE matrix with a pLDDT track, it shows:

- the predicted contact probability, P(d < 8 Å), from the distogram or AF3 contact_probs;
- the model's contacts against the predicted ones (green: both, vermillion: predicted only,
  purple: in the model only);
- the spread of each predicted distance (needs the distogram);
- how many AF3 seeds or AF2 models agree on each contact.

Predicted contacts can be drawn on the structure and exported to CSV, and the plot is saved in
ChimeraX sessions. AlphaLens opens output folders from AlphaFold2, AlphaPulldown, AlphaFold3, the
AlphaFold Server and ColabFold.

Local prediction (`alphalens predict`) runs AlphaFold2 or AlphaFold3 through
LocalFold by Sergey Ovchinnikov on Apple Silicon Macs and on Linux with an NVIDIA GPU, only when
you start it. The first prediction downloads and compiles the LocalFold engine from GitHub and
downloads the model parameters. UniProt IDs are looked up at UniProt, and the optional remote alignment search sends
your sequences to the ColabFold MSA server. AlphaFold3 parameters are under Google DeepMind's
terms of use, which you accept before the first AF3 prediction.

Documentation: https://github.com/KosinskiLab/ChimeraX-AlphaLens
"""

[project.urls]
Home = "https://github.com/KosinskiLab/ChimeraX-AlphaLens"

[tool.chimerax]
min-session-version = 1
max-session-version = 1
categories = ["Structure Prediction"]
classifiers = ["Development Status :: 4 - Beta"]

[tool.chimerax.package-data]
"src/" = ["weights/*.f32", "weights/*.txt"]
"src/docs/user/tools/" = ["*.html"]            # Help pages, made by scripts/build_help.py

[tool.chimerax.extra-files]
"src/docs/user/tools/alphalens_images" = ["docs/images/*.png"]     # Copied in when building

[tool.chimerax.tool."AlphaLens"]
category = "Structure Prediction"
description = "PAE, contact probability, model contacts, spread and agreement plots for AlphaFold predictions"

[tool.chimerax.command.alphalens]
category = "Structure Prediction"
description = "Show the AlphaLens plot for a predicted structure, or open a prediction folder"

[tool.chimerax.tool."AlphaLens Prediction"]
category = "Structure Prediction"
description = "Predict from sequences, FASTA, or UniProt IDs locally"

[tool.chimerax.command."alphalens predict"]
category = "Structure Prediction"
description = "Open the local prediction dialog for sequences or UniProt IDs"

[tool.chimerax.command."alphalens open"]
category = "Structure Prediction"
description = "Open an AlphaFold2 or AlphaFold3 prediction directory and show the AlphaLens plot"
