[build-system]
requires = ["ChimeraX-BundleBuilder>=1.4.0", "ChimeraX-Core~=1.6"]
build-backend = "chimerax.bundle_builder.cx_pep517"

[project]
name = "ChimeraX-AlphaLens"
version = "1.1.0"
license = { text = "MIT" }
authors = [{ name = "Dmitry Molodenskiy" }]
description = "AlphaFold PAE, contact-probability, model-distance, distogram-spread and seed-agreement plot (formerly DistoPAE)"
dependencies = ["ChimeraX-Core~=1.6", "ChimeraX-AlphaFold~=1.0"]
dynamic = ["classifiers", "requires-python"]

[project.readme]
content-type = "text"
text = """Interactive plot for AlphaFold2 / AlphaFold3 predictions (formerly DistoPAE). Shows the
predicted aligned error (PAE) matrix with a per-residue pLDDT track and, from the distogram or AF3
contact_probs, the predicted contact probability P(d < 8 A), the distances in the model with its
contacts colored by that probability, the spread of each predicted distance distribution and the agreement between
seeds or models. Predicted contacts can be drawn on the structure and exported to CSV."""

[project.urls]
Home = "https://github.com/KosinskiLab/AlphaLens"

[tool.chimerax]
min-session-version = 1
max-session-version = 1
categories = ["Structure Prediction"]
classifiers = ["Development Status :: 3 - Alpha"]

[tool.chimerax.package-data]
"src/" = ["weights/*.f32", "weights/*.txt"]

[tool.chimerax.tool."AlphaLens"]
category = "Structure Prediction"
description = "PAE, contact probability, model distances, spread and agreement plots for AlphaFold predictions"

[tool.chimerax.command.alphalens]
category = "Structure Prediction"
description = "Show the AlphaLens plot for a predicted structure, or open a prediction folder"

[tool.chimerax.tool."AlphaLens Prediction"]
category = "Structure Prediction"
description = "Predict from sequences, FASTA, or UniProt IDs locally"

[tool.chimerax.command."alphalens predict"]
category = "Structure Prediction"
description = "Open the local prediction dialog for sequences or UniProt IDs"

[tool.chimerax.command."alphalens open"]
category = "Structure Prediction"
description = "Open an AlphaFold2 or AlphaFold3 prediction directory and show the AlphaLens plot"

[tool.chimerax.command.distopae]
category = "Structure Prediction"
description = "Former name of the alphalens command"

[tool.chimerax.command."distopae open"]
category = "Structure Prediction"
description = "Former name of the alphalens open command"
